        "<b>Teaching companion — why is there an experiment 4 (quaternions)?</b><br>" +
        "The three angles on this page are decomposed from the attitude quaternion by the " +
        "firmware's <code>mahony_get_angles</code> using the <b>ZYX convention</b> (easy for " +
        "humans to read). But as <b>pitch approaches ±90°</b> (the red dashed lines above), " +
        "the ZYX decomposition hits <b>gimbal lock</b>: roll and yaw are no longer two " +
        "independent degrees of freedom — only the combination (yaw−roll) remains " +
        "distinguishable, so the three-parameter form loses one DOF and its derivative " +
        "diverges. The host-side gcc self-check (<code>testing/exp3_sim_main.c</code>, group B) " +
        "proves it numerically: at pitch=+90° the two different attitudes " +
        "(roll,yaw)=(0.10,0.60) and (−0.40,0.10) map to <b>the same quaternion</b> " +
        "(component difference ~1e-8), and reading back yields one arbitrary (roll,yaw).<br>" +
        "Experiment 4 (<code>exp4_quat</code>) sends <code>0x04</code> quaternion frames — " +
        "the four-parameter form is <b>singularity-free</b>, interpolates and multiplies " +
        "smoothly, and is the main 3D/rendering channel; the 0x03 frames here are the " +
        "teaching companion channel. Both experiments run the same Mahony filter with the " +
        "same preset parameters — pose representation is the only variable, which is exactly " +
        "why they are meant to be compared side by side.",
      "foot":
        "Source: euler_view.py (--mode sim local synthetic / --mode real device serial or " +
        "external bridge, e.g. the QEMU UART0 bridge); mode and language persist in " +
        "localStorage xrk.mode / xrk.lang. Frame spec single source: " +
        "固件侧 proto/frame.h（公开协议见 xiao_robot_kit_qemu docs/protocol-spec.md） · 公开协议 xiao_robot_kit_qemu docs/protocol-spec.md",
    },
  };

  var RANGES = { roll: 180, pitch: 90, yaw: 180 };
  var COLORS = { roll: "#4fc3f7", pitch: "#ffb74d", yaw: "#81c784" };
  var AXES = ["roll", "pitch", "yaw"];
  var peaks = { roll: 0, pitch: 0, yaw: 0 };
  /* 六轴列（与服务端 0x02 块序 / GET_BIAS 回执映射一致：ax,ay,az g ｜ gx,gy,gz dps） */
  var AXES6 = [{ k: "ax", i: 0, dig: 4 }, { k: "ay", i: 1, dig: 4 }, { k: "az", i: 2, dig: 4 },
               { k: "gx", i: 3, dig: 3 }, { k: "gy", i: 4, dig: 3 }, { k: "gz", i: 5, dig: 3 }];
  var TEMPCOMP_EN = 0x0001;       /* SYS_FLAGS bit0（与服务端 SYSF_TEMPCOMP_EN 同值） */
  var CMD_TIMEOUT_MS = 8000;      /* 同步命令的前端兵底（服务端 3s 就回，这里只防挂死） */
  var CAL_TIMEOUT_MS = 25000;     /* CALIBRATE：服务端上限 20s（采集 500 样本 ≈ 5s）+ 余量 */
  var TC_MARGIN_MS = 20000;       /* TEMP_CALIB：秒数 + 采集收尾余量（同服务端口径） */

  /* —— 偏好持久化（无 localStorage 时退化内存字典：隐私模式/node 桩）—— */
  var mem = {};
  var store = (function () {
    try {
      var ls = window.localStorage;
      if (ls && typeof ls.getItem === "function") { ls.getItem(LS_MODE); return ls; }
    } catch (e) { /* 落到内存字典 */ }
    return {
      getItem: function (k) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
      setItem: function (k, v) { mem[k] = String(v); },
    };
  })();

  function readPref(key, allowed, fallback) {
    var v = store.getItem(key);
    return allowed.indexOf(v) >= 0 ? v : fallback;
  }

  var pref = {
    mode: readPref(LS_MODE, MODES, "real"),   // 缺省真实：不点不启动（禁隐式仿真）
    lang: readPref(LS_LANG, LANGS, "zh"),     // 缺省中文
  };
  /* 服务端实际状态（/api/euler 回报；页面不臆测） */
  var srv = { mode: "none", target: "", connected: false, frames: 0, euler_frames: 0,
              seq_jumps: 0, bad_resync: 0, texts: [], cal: null, cal_frames: 0,
              ack_frames: 0, imu: {} };
  /* 命令交互态：busy=有命令在飞（三个按钮同步置灰）；note=状态行文本（zh/en 动态重建） */
  var cmd = { busy: false, note: "", lastNote: "", timer: 0 };

  function t(key, vars) {
    var table = DICT[pref.lang] || DICT.zh;
    var s = Object.prototype.hasOwnProperty.call(table, key) ? table[key] : key;
    if (vars) {
      Object.keys(vars).forEach(function (name) {
        s = s.split("{" + name + "}").join(String(vars[name]));
      });
    }
    return s;
  }

  /* —— 一次性提示（错误/离线）：写在 #meta，8s 内不被快照覆盖 —— */
  var flashText = "", flashUntil = 0;
  function showFlash(text) {
    flashText = text;
    flashUntil = Date.now() + 8000;
    renderMeta();
  }

  function byId(id) { return document.getElementById(id); }

  /* —— 真实模式目标输入（#target）：值就是服务端 /api/mode 认的目标串 —— */
  var savedTarget = (store.getItem(LS_TARGET) || "").trim();
  var targetTouched = savedTarget !== "";   /* 已持久化过就不再被服务端值覆盖 */

  function targetText() {          /* 空输入 = 按 placeholder 默认值（页面不凭空猜目标） */
    var el = byId("target");
    var v = (el.value || "").trim();
    return v || el.placeholder || "serial:COM5@115200";
  }

  /* —— 静态文案：所有 [data-i18n] / [data-i18n-html] 一键重建（切换即时生效）—— */
  function applyI18n() {
    var nodes = document.querySelectorAll("[data-i18n],[data-i18n-html]");
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      var key = el.getAttribute("data-i18n");
      if (key) el.textContent = t(key);
      key = el.getAttribute("data-i18n-html");
      if (key) el.innerHTML = t(key);
    }
    document.documentElement.setAttribute("lang", pref.lang === "en" ? "en" : "zh-CN");
    document.title = t("doc.title");
    var el = byId("target");
    el.setAttribute("placeholder", t("target.ph"));   /* 空输入时当默认目标串用 */
    el.title = t("target.title");
    var ports = byId("btn-ports");
    ports.textContent = t("btn.ports");
    ports.title = t("btn.portsTip");
    /* 命令按钮是 JS 文字（无 data-i18n），切语言时一并重建 */
    [["btn-read", "btn.read", "btn.readTip"], ["btn-zero", "btn.zero", "btn.zeroTip"],
     ["btn-tc", "btn.tc", "btn.tcTip"], ["btn-tc-en", "btn.tcEn", "btn.tcEnTip"]]
      .forEach(function (row) {
        var b = byId(row[0]);
        b.textContent = t(row[1]);
        b.title = t(row[2]);
      });
    lastTextKey = null;                                /* 切语言后 TEXT 日志（含空态）重建 */
  }

  /* —— 头部控件（分段开关 / 运行按钮 / 语言按钮 / 状态）—— */
  function hit(serverMode) {          /* 服务端在跑的模式与本页当前档一致？ */
    return srv.mode !== "none" && srv.mode === pref.mode;
  }

  function renderModeBar() {
    var bar = byId("modebar");
    bar.textContent = "";
    MODES.forEach(function (mode) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = t("mode." + mode);
      btn.title = t("mode." + mode + "Tip");
      btn.setAttribute("data-mode", mode);
      btn.className = pref.mode === mode ? "on" : "";
      btn.onclick = function () {           /* 只改档位 + 持久化，不启动任何数据源 */
        pref.mode = mode;
        store.setItem(LS_MODE, mode);
        renderChrome();
      };
      bar.appendChild(btn);
    });
  }

  function renderChrome() {
    renderModeBar();
    byId("realbar").hidden = pref.mode !== "real";   /* 目标输入只在真实模式出现 */
    var run = byId("btn-run");
    if (hit()) {
      run.textContent = pref.mode === "sim" ? t("btn.stopSim") : t("btn.disconnect");
    } else {
      run.textContent = pref.mode === "sim" ? t("btn.startSim") : t("btn.connect");
    }
    var lang = byId("btn-lang");
    lang.textContent = t("btn.lang");
    lang.title = t("btn.langTip");
    var status = byId("status");
    var word = srv.mode === "none" ? t("status.idle")
             : (srv.connected ? t("status.connected") : t("status.disconnected"));
    status.textContent = word;
    status.className = srv.connected && srv.mode !== "none" ? "on" : "";
  }

  function renderMeta() {
    var meta = byId("meta");
    if (flashText && Date.now() < flashUntil) {   /* 一次性提示不被 100ms 轮询的快照冲掉 */
      meta.textContent = flashText;
      return;
    }
    if (srv.mode === "none") { meta.textContent = t("meta.idle"); return; }
    var line = t("meta.line", {
      mode: t("mode." + srv.mode),
      conn: srv.connected ? t("status.connected") : t("status.disconnected"),
      frames: srv.frames, euler: srv.euler_frames,
      jumps: srv.seq_jumps, bad: srv.bad_resync,
    });
    if (srv.mode === "real" && srv.target) {
      line += " · " + t("meta.target", { target: srv.target });
    }
    meta.textContent = line;
  }

  /* —— 刷新串口：GET /api/ports → 填 <datalist>（只做联想，绝不改 #target 的值）—— */
  function refreshPorts() {
    return fetch("/api/ports").then(function (r) { return r.json(); }).then(function (s) {
      var list = byId("ports");
      var ports = (s && s.ports) || [];
      list.textContent = "";
      ports.forEach(function (p) {
        if (!p || !p.device) { return; }
        var opt = document.createElement("option");
        opt.value = "serial:" + p.device + "@115200";   /* 选中即合法目标串 */
        opt.label = p.desc ? p.device + " — " + p.desc : p.device;
        list.appendChild(opt);
      });
      byId("ports-info").textContent = s && s.error ? t("ports.error", { err: s.error })
                                                     : t("ports.found", { n: ports.length });
    }).catch(function () {
      byId("ports-info").textContent = t("meta.offline");
    });
  }

  /* —— 显式切换：只有用户点「启动仿真 / 连接真实 / 停止 / 断开」才 POST —— */
  function postMode(value) {
    var url = "/api/mode?value=" + encodeURIComponent(value);
    if (value === "real") {          /* 真实模式带上目标（空输入 = placeholder 默认） */
      var tgt = targetText();
      var box = byId("target");
      if (!(box.value || "").trim()) { box.value = tgt; targetTouched = true; }
      store.setItem(LS_TARGET, tgt);   /* 连过的目标下次开页直接回填 */
      url += "&target=" + encodeURIComponent(tgt);
    }
    return fetch(url, { method: "POST" }).then(function (r) { return r.json(); })
      .then(function (s) {
        if (s && s.error) {           /* 目标串非法等：服务端拒绝，档位不变 */
          showFlash(t("meta.err", { err: s.error }));
        }
        srv.mode = s.mode || "none";
        srv.connected = !!s.connected;
        cmd.note = "";                  /* 换档位/停源：上一条命令回执不再适用 */
        if (srv.mode === "none") { peaks = { roll: 0, pitch: 0, yaw: 0 }; }
        renderChrome();
        renderMeta();
        renderCalib();
        setCmdBusy(false, "");
      }).catch(function () {
        showFlash(t("meta.offline"));
      });
  }

  /* ═══ 零点校准：三个控件（与 IMU 统一页同语义）—— 采集与拟合全在 MCU，主机只发命令 + 读数据
     ① 读取当前值 → GET_BIAS(0x02) + GET_STATUS(0x0A)
     ② 一键调零 → CALIBRATE(0x01)（异步，等 ACK；期间按钮置灰 +「校准中…」）
     ③ 温漂补偿 → TEMP_CALIB(0x03, 秒) / SET_FLAGS(0x09) 开关 TEMPCOMP_EN /
                  GET_TC_STATE(0x10) / GET_DRIFT(0x0D)
     命令只走 POST /api/imu/cmd（{func, args}）；回执一律显示服务端 code，不自己编结论。═══ */

  function fmt6(axis, v) {
    if (v === null || v === undefined) { return "—"; }
    return fmt(v, axis.dig);
  }

  /* GET_BIAS 回执是 imu_bias_t 口径（gyro 在前），表列是 ax..az,gx..gz → 按列名取值 */
  function ackBiasAt(bias, axis) { return bias ? bias[axis.k] : null; }

  function renderCalib() {
    var cal = srv.cal, imu = srv.imu || {};
    var raw = cal ? cal.raw : null, deb = cal ? cal.deb : null;
    AXES6.forEach(function (a) {
      byId("c-raw-" + a.k).textContent = fmt6(a, raw ? raw[a.i] : null);
      byId("c-deb-" + a.k).textContent = fmt6(a, deb ? deb[a.i] : null);
      byId("c-fbias-" + a.k).textContent = fmt6(a, cal && cal.bias ? cal.bias[a.i] : null);
      byId("c-ack-" + a.k).textContent = fmt6(a, ackBiasAt(imu.bias, a));
      byId("c-dlt-" + a.k).textContent =
        (raw && deb) ? fmt6(a, raw[a.i] - deb[a.i]) : "—";
    });
    byId("v-temp").textContent = (cal && typeof cal.temp === "number")
      ? cal.temp.toFixed(1) + " \u00B0C" : "—";
    renderCalibState();
    byId("calib-hint").textContent = calibHint();
  }

  function flagText(v) {
    if (v === null || v === undefined) { return "—"; }
    return v ? t("calib.on") : t("calib.off");
  }

  function renderCalibState() {
    var imu = srv.imu || {};
    byId("s-bias-valid").textContent = flagText(imu.bias_valid);
    byId("s-tc-valid").textContent = flagText(imu.tc_valid);
    byId("s-enabled").textContent = flagText(imu.enabled);
    byId("s-tref").textContent =
      (typeof imu.t_now === "number")
        ? imu.t_now.toFixed(1) + "/" + (typeof imu.t_ref === "number" ? imu.t_ref.toFixed(1) : "—")
        : "—";
    byId("s-kg").textContent = imu.k_g
      ? imu.k_g.map(function (k) { return k.toFixed(4); }).join(" ")
      : "—";
    byId("s-applied").textContent =
      (imu.apply_count === null || imu.apply_count === undefined) ? "—" : String(imu.apply_count);
  }

  function calibHint() {
    if (srv.mode === "none") { return t("calib.hint.idle"); }
    var hasAck = srv.ack_frames > 0;
    if (!hasAck) { return t("calib.hint.empty"); }
    return srv.mode === "sim" ? t("calib.hint.sim") : t("calib.hint.real");
  }

  /* —— 命令执行：一次只飞一个（三个按钮同步置灰），回执按 code 翻译 —— */
  function setCmdBusy(busy, note) {
    cmd.busy = busy;
    cmd.note = note || "";
    ["btn-read", "btn-zero", "btn-tc", "btn-tc-en"].forEach(function (id) {
      byId(id).disabled = busy ? true : false;
    });
    byId("cmd-status").textContent = cmd.note;
  }

  function cmdTimeoutMs(func, args) {
    if (func === "CALIBRATE") { return CAL_TIMEOUT_MS; }
    if (func === "TEMP_CALIB") { return ((args && args.seconds) || 30) * 1000 + TC_MARGIN_MS; }
    return CMD_TIMEOUT_MS;
  }

  function postCmd(func, args) {
    var body = { func: func };
    if (args) { body.args = args; }
    return fetch("/api/imu/cmd", { method: "POST",
                                   headers: { "Content-Type": "application/json" },
                                   body: JSON.stringify(body) })
      .then(function (r) { return r.json(); });
  }

  function cmdResultText(res) {
    var code = (res && res.code) || "";
    var func = (res && res.func) || "?";
    if (code === "ok") { return t("cmd.ok", { func: func }); }
    if (code === "notConnected") { return t("cmd.notConnected"); }
    if (code === "timeout") { return t("cmd.timeout", { func: func }); }
    if (code === "ackError") {
      return t("cmd.ackError", { func: func,
                                  status: res.status,
                                  name: (res.statusName || "") });
    }
    return t("cmd.badArgs", { func: func });
  }

  /* 顺序执行一串命令（前一步非 ok 就停）：读取/调零/温漂都是「写 + 回读」的组合 */
  function runCmdSteps(steps, i) {
    if (i >= steps.length) {
      setCmdBusy(false, cmd.lastNote);         /* 最后一步的回执文本留在状态行 */
      return;
    }
    var step = steps[i];
    var slow = step.func === "CALIBRATE" || step.func === "TEMP_CALIB";
    setCmdBusy(true, slow ? t("cmd.calibrating")
                          : t("cmd.running", { func: step.func }));
    var guard = setTimeout(function () {        /* 前端兵底：后端挂死也要把按钮还回来 */
      setCmdBusy(false, t("cmd.timeout", { func: step.func }));
    }, cmdTimeoutMs(step.func, step.args));
    postCmd(step.func, step.args).then(function (res) {
      clearTimeout(guard);
      if (res && res.code === "ok") {
        cmd.lastNote = cmdResultText(res);
        runCmdSteps(steps, i + 1);
      } else {
        setCmdBusy(false, cmdResultText(res));
      }
    }).catch(function () {
      clearTimeout(guard);
      setCmdBusy(false, t("meta.offline"));
    });
  }

  function onReadClick() {
    runCmdSteps([{ func: "GET_BIAS" }, { func: "GET_STATUS" }], 0);
  }

  function onZeroClick() {      /* CALIBRATE 异步：采集结束才回 ACK，回后重读零偏与状态 */
    runCmdSteps([{ func: "CALIBRATE" }, { func: "GET_BIAS" }, { func: "GET_STATUS" }], 0);
  }

  function onTempCalibClick() {
    var el = byId("tcsec");
    var seconds = parseInt(el.value, 10);
    if (!(seconds >= 1 && seconds <= 255)) { seconds = 30; el.value = "30"; }
    runCmdSteps([{ func: "TEMP_CALIB", args: { seconds: seconds } },
                 { func: "GET_TC_STATE" }, { func: "GET_DRIFT" }], 0);
  }

  /* SET_FLAGS 是整字写入：先 GET_STATUS 读回 flags，再只翻转 bit0（TEMPCOMP_EN） */
  function onTempCompToggle() {
    if (cmd.busy) { return; }
    setCmdBusy(true, t("cmd.running", { func: "GET_STATUS" }));
    var guard = setTimeout(function () {
      setCmdBusy(false, t("cmd.timeout", { func: "SET_FLAGS" }));
    }, CMD_TIMEOUT_MS * 3);
    postCmd("GET_STATUS").then(function (res) {
      if (!res || res.code !== "ok" || !res.data || typeof res.data.flags !== "number") {
        clearTimeout(guard);
        setCmdBusy(false, cmdResultText(res));
        return null;
      }
      return postCmd("SET_FLAGS", { flags: res.data.flags ^ TEMPCOMP_EN }).then(function (r2) {
        if (!r2 || r2.code !== "ok") {
          clearTimeout(guard);
          setCmdBusy(false, cmdResultText(r2));
          return null;
        }
        return postCmd("GET_TC_STATE");
      });
    }).then(function (r3) {
      if (r3 === null || r3 === undefined) { return; }   /* 前面的分支已收口 */
      clearTimeout(guard);
      setCmdBusy(false, cmdResultText(r3));
    }).catch(function () {
      clearTimeout(guard);
      setCmdBusy(false, t("meta.offline"));
    });
  }

  /* —— TEXT 日志（0x7F）：`OK calib …` 行高亮（成功标定一眼可见）—— */
  var lastTextKey = null;
  function renderTexts() {
    var texts = srv.texts || [];
    var key = texts.join("\u0000");
    if (key === lastTextKey) { return; }    /* 100ms 轮询下只在线集合变化时重建 DOM */
    lastTextKey = key;
    var box = byId("textlog");
    box.textContent = "";
    if (!texts.length) {
      var empty = document.createElement("div");
      empty.className = "txt-line";
      empty.textContent = t("textlog.empty");
      box.appendChild(empty);
      return;
    }
    texts.forEach(function (line) {
      var el = document.createElement("div");
      el.className = line.indexOf("OK calib") === 0 ? "txt-line txt-cal" : "txt-line";
      el.textContent = line;
      box.appendChild(el);
    });
  }

  function onRunClick() {
    postMode(hit() ? "none" : pref.mode);
  }

  byId("btn-run").onclick = onRunClick;
  byId("btn-read").onclick = onReadClick;
  byId("btn-zero").onclick = onZeroClick;
  byId("btn-tc").onclick = onTempCalibClick;
  byId("btn-tc-en").onclick = onTempCompToggle;
  byId("btn-ports").onclick = refreshPorts;
  byId("target").oninput = function () {
    targetTouched = true;
    store.setItem(LS_TARGET, this.value);
  };
  byId("btn-lang").onclick = function () {
    pref.lang = pref.lang === "zh" ? "en" : "zh";
    store.setItem(LS_LANG, pref.lang);
    applyI18n();
    renderChrome();
    renderMeta();
    renderCalib();
    setCmdBusy(cmd.busy, cmd.note ? cmd.note : "");
    renderTexts();
  };

  /* —— 三轴条形 canvas —— */
  var cv = byId("bars");
  var ctx = cv.getContext("2d");
  var W = cv.width, H = cv.height;
  var ROW_H = 66, PAD_L = 64, PAD_R = 24;

  function fmt(v, dig) { return (v >= 0 ? "+" : "") + v.toFixed(dig); }

  function drawBar(axis, row, angle) {
    var y0 = 14 + row * ROW_H;
    var x0 = PAD_L, x1 = W - PAD_R;
    var mid = (x0 + x1) / 2, half = (x1 - x0) / 2;
    ctx.strokeStyle = "#2c353d";
    ctx.beginPath(); ctx.moveTo(mid, y0); ctx.lineTo(mid, y0 + 34); ctx.stroke();
    /* 刻度 */
    ctx.fillStyle = "#546e7a"; ctx.font = "10px Consolas"; ctx.textAlign = "center";
    var step = RANGES[axis] / 3;
    for (var k = -3; k <= 3; k++) {
      if (!k) continue;
      var gx = mid + half * k / 3;
      ctx.strokeStyle = "#232b32";
      ctx.beginPath(); ctx.moveTo(gx, y0 + 34); ctx.lineTo(gx, y0 + 38); ctx.stroke();
      ctx.fillText((k > 0 ? "+" : "") + Math.round(step * k) + "\u00B0", gx, y0 + 49);
    }
    /* pitch 锁边界（±90° = 条形图两端，红虚线强调） */
    if (axis === "pitch") {
      ctx.strokeStyle = "#e57373"; ctx.setLineDash([4, 3]);
      [x0, x1].forEach(function (gx) {
        ctx.beginPath(); ctx.moveTo(gx, y0 - 2); ctx.lineTo(gx, y0 + 36); ctx.stroke();
      });
      ctx.setLineDash([]);
    }
    /* 数值条（中心零点，左右对称域） */
    var frac = Math.max(-1, Math.min(1, angle / RANGES[axis]));
    var bx = frac >= 0 ? mid : mid + half * frac;
    var bw = Math.abs(half * frac);
    ctx.fillStyle = COLORS[axis];
    ctx.fillRect(bx, y0 + 8, Math.max(bw, frac === 0 ? 0 : 1), 18);
    /* 轴标签 + 当前值 */
    ctx.fillStyle = COLORS[axis]; ctx.font = "13px Consolas"; ctx.textAlign = "left";
    ctx.fillText(axis, 8, y0 + 22);
    ctx.textAlign = "right";
    ctx.fillText(fmt(angle, 2) + "\u00B0", x1, y0 + 4);
  }

  function render(last) {
    ctx.clearRect(0, 0, W, H);
    drawBar("roll", 0, last[0]);
    drawBar("pitch", 1, last[1]);
    drawBar("yaw", 2, last[2]);
  }

  /* 未启动 / 无 0x03 帧：表显 — 且清画布（不显示上一次的残留数值） */
  function clearValues() {
    AXES.forEach(function (a) {
      byId("v-" + a).textContent = "—";
      byId("r-" + a).textContent = "—";
      byId("p-" + a).textContent = "—";
    });
    ctx.clearRect(0, 0, W, H);
  }

  /* —— /api/euler 100ms 轮询（只读，不隐含启动）—— */
  function tick() {
    fetch("/api/euler").then(function (r) { return r.json(); }).then(function (s) {
      srv.mode = (s.mode === "sim" || s.mode === "real") ? s.mode : "none";
      srv.target = s.target || "";
      srv.connected = !!s.connected;
      srv.frames = s.frames || 0;
      srv.euler_frames = s.euler_frames || 0;
      srv.seq_jumps = s.seq_jumps || 0;
      srv.bad_resync = s.bad_resync || 0;
      srv.texts = s.texts || [];
      srv.cal = s.cal || null;
      srv.cal_frames = s.cal_frames || 0;
      srv.ack_frames = s.ack_frames || 0;
      srv.imu = s.imu || {};
      if (!targetTouched && srv.target) { byId("target").value = srv.target; }
      renderChrome();
      renderMeta();
      renderCalib();
      renderTexts();
      if (!s.last_deg || srv.mode === "none") { clearValues(); return; }
      var d = s.last_deg, rd = s.last_rad;
      AXES.forEach(function (a, i) {
        var av = Math.abs(d[i]);
        if (av > peaks[a]) peaks[a] = av;
        byId("v-" + a).textContent = fmt(d[i], 3) + " \u00B0";
        byId("r-" + a).textContent = fmt(rd[i], 4);
        byId("p-" + a).textContent = fmt(peaks[a], 3) + " \u00B0";
      });
      render(d);
    }).catch(function () {
      showFlash(t("meta.offline"));
    });
  }

  /* 初始化：只按持久值铺文案 + 高亮模式 + 回填已持久目标，**不发任何 /api/mode 请求** */
  byId("target").value = savedTarget;
  applyI18n();
  renderChrome();
  renderMeta();
  clearValues();
  renderCalib();
  setCmdBusy(false, "");
  renderTexts();
  tick();
  setInterval(tick, 100);
})();
</script>
</body>
</html>
