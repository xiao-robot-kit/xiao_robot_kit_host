<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>store_demo — pstore 断电续跑</title>
<!-- 薄壳（服务器架构）：页面核心在共享资产 /assets/store-page.js，
     本文件只声明 window.STORE_PAGE + 给出宿主容器 #app（三按钮/快照/TEXT 日志
     都由页面核心挂进去）。
     数据面 = /api/store/cmd（MOD_STORE=0x20）+ SSE（TEXT 行）。
     数据源显式：加载不启动任何数据源，点「仿真/真实 → 启动/连接」才 POST /api/open。 -->
</head>
<body>
<div id="app"></div>
<script>window.STORE_PAGE = {id: "store_demo", title: "pstore 断电续跑（MOD_STORE）"};</script>
<script src="/assets/ui-shell.js"></script>
<script src="/assets/live.js"></script>
<script src="/assets/store-page.js"></script>
</body>
</html>
